name: Ask the Sources web MVP checks

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Build web and API bundle
        run: npm run build
